<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH2 Achievement Tracker</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="bg-symbol bg-symbol-right-top"></div>
    <div class="bg-symbol bg-symbol-right-bottom"></div>

    <header>
        <img
            src="assets/ui/logo.webp"
            alt="Kingdom Hearts II Final Mix"
            class="kh-logo"
        >
        <p>Achievement Tracker</p>
    </header>

    <div class="kh-divider kingdom-key-divider">
    <div class="divider-line"></div>

    <img
        src="assets/ui/keyblades.webp"
        alt=""
        class="kingdom-key"
    >

    <div class="divider-line"></div>
</div>

    <main>

        <section class="progress-section">
            <h2>Progreso</h2>

            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <p id="progress-text">0 / 0 completados</p>
        </section>

        <section class="controls">

            <input
                type="text"
                id="search"
                placeholder="Buscar logro..."
            >

            <div class="filters">
                <button data-filter="all">Todos</button>
                <button data-filter="pending">Pendientes</button>
                <button data-filter="completed">Completados</button>
            </div>

            <div class="category-filters">
                <button data-category="all">Todas</button>
                <button data-category="Historia">Historia</button>
                <button data-category="Jiminy's Journal">Diario</button>
                <button data-category="Coliseo">Coliseo</button>
                <button data-category="Gummi">Gummi</button>
                <button data-category="Minijuegos">Minijuegos</button>
                <button data-category="Jefes">Jefes</button>
                <button data-category="Otros">Otros</button>
                <button data-category="Finalización">Finalización</button>
            </div>

        </section>

        <section id="achievement-list"></section>

    </main>

    <script src="app.js"></script>

</body>
</html>
